schema_version = "1.0.0"

[context]
declared_sources = []

[custody]
isolation = "worktree"

[governance]
approval_categories = ["destructive_operations"]
protected_paths = []

[init]
ci = false
diagram_style = "ascii"
entrypoints = [
    "AGENTS.md",
    "CLAUDE.md",
    "GEMINI.md",
    "CODEX.md",
]
specs = true

[proof]
validation_buildkite_preflights = false

[[proof.commands]]
name = "audit-contract"
command = "/usr/bin/python3.13"
args = ["-I", "-S", "-B", "scripts/check_audit.py"]
description = "Independently accepted privileged-write audit criterion"
required = true

[[proof.commands]]
name = "guard-contract"
command = "/usr/bin/grep"
args = ["-F", "-x", "--", "required", "src/guard.txt"]
description = "Independently accepted literal source assertion"
required = true

[[proof.commands]]
name = "payload-contract"
command = "/usr/bin/grep"
args = ["-F", "-x", "--", "ready", "src/payload.txt"]
description = "Independently accepted literal source assertion"
required = true

[proof.required_profile]
id = "repo.pr-readiness.v1"
reviewed_sources_digest = "sha256:b25a716119c5b5de101f6b6bf32a4402ec1116c7cf89b783675a3e88f86f6cd5"

[proof.observed_path]
schema_version = "1.0.0"
scope = "native_proof_calls"
required = true

[proof.repository_contract]
canonical_local_target = false
reviewed_commands_digest = "sha256:fd4004c307c56e5b1c65960ac4eef2464c40b8558f321d88241b95773f0b3850"
source_coverage = []

[proof.repository_contract.executions.guard-contract]
program = "/usr/bin/grep"
directory = "."
timeout_seconds = 10
[proof.repository_contract.executions.guard-contract.toolchain_files]
declared_loader = "/usr/lib/aarch64-linux-gnu/ld-linux-aarch64.so.1"
[proof.repository_contract.executions.guard-contract.environment]
LC_ALL = "C"

[proof.repository_contract.executions.payload-contract]
program = "/usr/bin/grep"
directory = "."
timeout_seconds = 10
[proof.repository_contract.executions.payload-contract.toolchain_files]
declared_loader = "/usr/lib/aarch64-linux-gnu/ld-linux-aarch64.so.1"
[proof.repository_contract.executions.payload-contract.environment]
LC_ALL = "C"

[repo]
architecture_direction = "cli"
backend = "local"
base_branch = "main"
container_workspaces = false
done_criteria = "Both accepted literal assertions execute through the native authorizer with current path evidence; no merge authority"
external_tracker = false
primary_languages = ["text"]
product_name = "Native path acceptance"
product_summary = "Exercise the accepted required native-call path, actual failure and fresh repair in an isolated local fixture; admit only the exact fixture head and independently accepted base; never merge."
product_type = "service_or_library"

[tracker]
provider = "decapod"

[proof.repository_contract.executions.audit-contract]
program = "/usr/bin/python3.13"
directory = "."
timeout_seconds = 10
[proof.repository_contract.executions.audit-contract.toolchain_files]
python-runtime-0 = "/usr/lib/python3.13/os.py"
python-runtime-1 = "/usr/lib/python3.13/encodings/__init__.py"
python-runtime-2 = "/usr/lib/python3.13/encodings/utf_8.py"

[proof.repository_contract.executions.audit-contract.environment]
LC_ALL = "C"

[proof.selected_work]
schema_version = "1.0.0"
id = "actual-selected-audit"
intent_id = "intent:change_01M7P3DSBYV52HDJSBGD87Q5QK"
instruction_revision = "sha256:ee3d78823c1c7d0f8a1f786cbd46d045d7d0bd6201efb1d2f7b29c037a1637e4"

[[proof.selected_work.roots]]
id = "R1-API"
checks = ["guard-contract"]

[[proof.selected_work.roots]]
id = "R2-UI"
checks = ["payload-contract"]

[[proof.selected_work.roots]]
id = "R3-AUDIT"
checks = ["audit-contract"]

[[proof.selected_work.relations]]
id = "REL-AB"
requirement = "R1-API"
left = "A"
right = "B"
kind = "eq"

[[proof.selected_work.relations]]
id = "REL-BC"
requirement = "R2-UI"
left = "B"
right = "C"
kind = "eq"

[[proof.selected_work.relations]]
id = "REL-AC"
requirement = "R3-AUDIT"
left = "A"
right = "C"
kind = "ne"
